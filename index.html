<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>NFC Manager</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 700px;
      margin: 0 auto;
      padding: 30px 20px;
      background: #f5f5f5;
    }

    h1 {
      text-align: center;
    }

    .box {
      background: white;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 20px;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      margin: 8px 0 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 12px;
      border: 0;
      border-radius: 8px;
      background: #111;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.85;
    }

    .message {
      margin-top: 15px;
      padding: 12px;
      border-radius: 8px;
      background: #eee;
    }

    .item {
      border: 1px solid #ddd;
      padding: 15px;
      border-radius: 8px;
      margin-top: 10px;
    }

    .item strong {
      display: block;
      margin-bottom: 8px;
    }

    .nfc-url {
      word-break: break-all;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <h1>📱 NFC Manager</h1>

  <div class="box">

    <h2>Добави NFC</h2>

    <label>NFC код</label>

    <input
      id="code"
      type="text"
      placeholder="например 001"
    >

    <label>Линк</label>

    <input
      id="targetUrl"
      type="url"
      placeholder="https://google.com"
    >

    <button onclick="addNfc()">
      Добави NFC
    </button>

    <div
      id="message"
      class="message"
      style="display:none;"
    ></div>

  </div>


  <div class="box">

    <h2>Моите NFC кодове</h2>

    <div id="list">
      Зареждане...
    </div>

  </div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
  "https://dnanabhqzdldrtsqpgbi.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_kfnwpu7Kk8wJUm-FRSnWvQ_x_7bcTiw";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


const WORKER_URL =
  "https://nfc-redirect.gborisov1512.workers.dev";


function showMessage(text) {

  const box =
    document.getElementById("message");

  box.style.display = "block";

  box.textContent = text;

}


async function addNfc() {

  const code =
    document.getElementById("code").value.trim();

  const targetUrl =
    document.getElementById("targetUrl").value.trim();


  if (!code) {

    showMessage("Моля въведи NFC код.");

    return;
  }


  if (!targetUrl) {

    showMessage("Моля въведи линк.");

    return;
  }


  try {

    new URL(targetUrl);

  } catch {

    showMessage(
      "Линкът не е валиден."
    );

    return;
  }


  const { data, error } =
    await supabaseClient
      .from("nfc_links")
      .insert([
        {
          code: code,
          url: targetUrl
        }
      ])
      .select();


  if (error) {

    showMessage(
      "Грешка: " + error.message
    );

    return;
  }


  showMessage(
    "NFC кодът е добавен успешно!"
  );


  document.getElementById("code").value = "";

  document.getElementById("targetUrl").value = "";


  loadNfc();

}


async function loadNfc() {

  const list =
    document.getElementById("list");


  const { data, error } =
    await supabaseClient
      .from("nfc_links")
      .select("id, code, url")
      .order("id", {
        ascending: false
      });


  if (error) {

    list.textContent =
      "Грешка: " + error.message;

    return;
  }


  if (!data || data.length === 0) {

    list.textContent =
      "Все още няма NFC кодове.";

    return;
  }


  list.innerHTML = "";


  data.forEach(item => {

    const div =
      document.createElement("div");

    div.className = "item";


    const title =
      document.createElement("strong");

    title.textContent =
      "NFC #" + item.code;


    const link =
      document.createElement("div");

    link.textContent =
      item.url;


    const nfc =
      document.createElement("div");

    nfc.className = "nfc-url";

    nfc.style.marginTop = "10px";


    nfc.textContent =
      WORKER_URL + "/" + item.code;


    div.appendChild(title);

    div.appendChild(link);

    div.appendChild(nfc);


    list.appendChild(div);

  });

}


loadNfc();

</script>

</body>
</html>
