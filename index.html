<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Моите NFC линкове</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #222;
    }

    .container {
      max-width: 900px;
      margin: 40px auto;
      padding: 20px;
    }

    .card {
      background: white;
      border-radius: 14px;
      padding: 25px;
      margin-bottom: 20px;
      box-shadow: 0 4px 20px rgba(0,0,0,.08);
    }

    h1 {
      margin-top: 0;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ddd;
      border-radius: 8px;
      margin: 8px 0 15px;
      font-size: 16px;
    }

    button {
      border: 0;
      border-radius: 8px;
      padding: 12px 18px;
      cursor: pointer;
      font-size: 15px;
      background: #111;
      color: white;
    }

    button:hover {
      opacity: .85;
    }

    .nfc-item {
      border: 1px solid #eee;
      border-radius: 10px;
      padding: 15px;
      margin-top: 12px;
    }

    .nfc-code {
      font-weight: bold;
      margin-bottom: 8px;
    }

    .url {
      word-break: break-all;
      color: #555;
      margin-bottom: 12px;
    }

    .hidden {
      display: none;
    }

    .error {
      color: #c00;
      margin-top: 10px;
    }

    .success {
      color: #087f23;
      margin-top: 10px;
    }
  </style>
</head>

<body>

<div class="container">

  <div id="loginCard" class="card">
    <h1>🔐 NFC панел</h1>

    <p>Влез в административния панел.</p>

    <input
      type="email"
      id="email"
      placeholder="Имейл"
    >

    <input
      type="password"
      id="password"
      placeholder="Парола"
    >

    <button onclick="login()">Вход</button>

    <div id="loginMessage"></div>
  </div>


  <div id="adminPanel" class="hidden">

    <div class="card">
      <h1>📱 Моите NFC линкове</h1>

      <p>
        Тук можеш да създаваш и управляваш своите NFC чипове.
      </p>

      <button onclick="logout()">Изход</button>
    </div>


    <div class="card">

      <h2>➕ Нов NFC чип</h2>

      <label>NFC код</label>

      <input
        type="text"
        id="code"
        placeholder="например 001"
      >

      <label>Линк</label>

      <input
        type="url"
        id="url"
        placeholder="https://example.com"
      >

      <button onclick="addNfc()">Добави NFC</button>

      <div id="addMessage"></div>

    </div>


    <div class="card">

      <h2>📋 Моите NFC чипове</h2>

      <div id="nfcList">
        Зареждане...
      </div>

    </div>

  </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

  const SUPABASE_URL =
    "https://dnanabhqzdldrtsqpgbi.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_kfnwpu7Kk8wJUm-FRSnWvQ_x_7bcTiw";


  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  async function login() {

    const email =
      document.getElementById("email").value;

    const password =
      document.getElementById("password").value;

    const message =
      document.getElementById("loginMessage");

    message.innerHTML = "Влизане...";

    const { error } =
      await supabaseClient.auth.signInWithPassword({
        email,
        password
      });

    if (error) {

      message.className = "error";

      message.innerHTML =
        "Грешка: " + error.message;

      return;
    }

    message.innerHTML = "";

    showAdmin();
  }


  async function logout() {

    await supabaseClient.auth.signOut();

    document
      .getElementById("adminPanel")
      .classList.add("hidden");

    document
      .getElementById("loginCard")
      .classList.remove("hidden");
  }


  async function showAdmin() {

    document
      .getElementById("loginCard")
      .classList.add("hidden");

    document
      .getElementById("adminPanel")
      .classList.remove("hidden");

    loadNfc();
  }


  async function addNfc() {

    const code =
      document.getElementById("code").value.trim();

    const url =
      document.getElementById("url").value.trim();

    const message =
      document.getElementById("addMessage");

    if (!code || !url) {

      message.className = "error";

      message.innerHTML =
        "Моля, попълни и двете полета.";

      return;
    }

    const { error } =
      await supabaseClient
        .from("nfc_links")
        .insert({
          code: code,
          url: url
        });

    if (error) {

      message.className = "error";

      message.innerHTML =
        "Грешка: " + error.message;

      return;
    }

    message.className = "success";

    message.innerHTML =
      "NFC чипът е добавен успешно!";

    document.getElementById("code").value = "";
    document.getElementById("url").value = "";

    loadNfc();
  }


  async function loadNfc() {

    const list =
      document.getElementById("nfcList");

    list.innerHTML = "Зареждане...";

    const { data, error } =
      await supabaseClient
        .from("nfc_links")
        .select("*")
        .order("id", { ascending: true });

    if (error) {

      list.innerHTML =
        "<p class='error'>" +
        error.message +
        "</p>";

      return;
    }

    if (!data || data.length === 0) {

      list.innerHTML =
        "<p>Все още няма NFC чипове.</p>";

      return;
    }

    list.innerHTML = "";

    data.forEach(item => {

      const publicUrl =
        window.location.origin +
        "/nfc/" +
        item.code;

      const div =
        document.createElement("div");

      div.className = "nfc-item";

      div.innerHTML = `
        <div class="nfc-code">
          NFC #${item.code}
        </div>

        <div class="url">
          ${item.url}
        </div>

        <div>
          <strong>NFC адрес:</strong><br>
          ${publicUrl}
        </div>
      `;

      list.appendChild(div);

    });
  }


  async function checkSession() {

    const { data } =
      await supabaseClient.auth.getSession();

    if (data.session) {
      showAdmin();
    }
  }


  checkSession();

</script>

</body>
</html>
