<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NFC Manager</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 700px;
      margin: auto;
      padding: 25px 15px;
      background: #f5f5f5;
    }

    .box {
      background: white;
      padding: 20px;
      margin-bottom: 20px;
      border-radius: 12px;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      margin: 7px 0 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 12px;
      border: 0;
      border-radius: 8px;
      background: #111;
      color: white;
      font-size: 16px;
      margin-top: 5px;
    }

    button.secondary {
      background: #777;
    }

    .item {
      background: white;
      border: 1px solid #ddd;
      padding: 15px;
      margin-top: 10px;
      border-radius: 8px;
    }

    .nfc-url {
      word-break: break-all;
      margin-top: 8px;
      font-size: 14px;
    }

    .hidden {
      display: none;
    }

    #message {
      margin-top: 12px;
      padding: 10px;
    }
  </style>
</head>

<body>

<h1>📱 NFC Manager</h1>


<!-- LOGIN -->

<div id="loginBox" class="box">

  <h2>Вход</h2>

  <input
    id="email"
    type="email"
    placeholder="Имейл"
  >

  <input
    id="password"
    type="password"
    placeholder="Парола"
  >

  <button onclick="login()">
    Вход
  </button>

  <div id="loginMessage"></div>

</div>


<!-- ADMIN -->

<div id="adminBox" class="hidden">

  <div class="box">

    <h2>Добави NFC</h2>

    <input
      id="code"
      type="text"
      placeholder="NFC код например 003"
    >

    <input
      id="targetUrl"
      type="url"
      placeholder="https://google.com"
    >

    <button onclick="addNfc()">
      Добави NFC
    </button>

    <button
      class="secondary"
      onclick="logout()"
    >
      Изход
    </button>

    <div id="message"></div>

  </div>


  <div class="box">

    <h2>Моите NFC кодове</h2>

    <div id="list">
      Зареждане...
    </div>

  </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
  "https://dnanabhqzdldrtsqpgbi.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_kfnwpu7Kk8wJUm-FRSnWvQ_x_7bcTiw";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


const WORKER_URL =
  "https://nfc-redirect.gborisov1512.workers.dev";


async function checkUser() {

  const {
    data: { session }
  } = await supabaseClient.auth.getSession();


  if (session) {

    document
      .getElementById("loginBox")
      .classList.add("hidden");

    document
      .getElementById("adminBox")
      .classList.remove("hidden");

    loadNfc();

  }

}


async function login() {

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;


  const {
    error
  } =
    await supabaseClient.auth.signInWithPassword({
      email: email,
      password: password
    });


  if (error) {

    document
      .getElementById("loginMessage")
      .textContent =
      "Грешка: " + error.message;

    return;

  }


  document
    .getElementById("loginBox")
    .classList.add("hidden");

  document
    .getElementById("adminBox")
    .classList.remove("hidden");

  loadNfc();

}


async function logout() {

  await supabaseClient.auth.signOut();

  location.reload();

}


async function addNfc() {

  const code =
    document.getElementById("code").value.trim();

  const targetUrl =
    document.getElementById("targetUrl").value.trim();


  if (!code || !targetUrl) {

    document
      .getElementById("message")
      .textContent =
      "Попълни и двете полета.";

    return;

  }


  try {

    new URL(targetUrl);

  } catch {

    document
      .getElementById("message")
      .textContent =
      "Невалиден линк.";

    return;

  }


  const {
    error
  } =
    await supabaseClient
      .from("nfc_links")
      .insert({
        code: code,
        url: targetUrl
      });


  if (error) {

    document
      .getElementById("message")
      .textContent =
      "Грешка: " + error.message;

    return;

  }


  document
    .getElementById("message")
    .textContent =
    "NFC кодът е добавен успешно!";


  document
    .getElementById("code")
    .value = "";

  document
    .getElementById("targetUrl")
    .value = "";


  loadNfc();

}


async function loadNfc() {

  const list =
    document.getElementById("list");


  const {
    data,
    error
  } =
    await supabaseClient
      .from("nfc_links")
      .select("id, code, url")
      .order("id", {
        ascending: false
      });


  if (error) {

    list.textContent =
      "Грешка: " + error.message;

    return;

  }


  if (!data || data.length === 0) {

    list.textContent =
      "Няма NFC кодове.";

    return;

  }


  list.innerHTML = "";


  data.forEach(item => {

    const div =
      document.createElement("div");

    div.className = "item";


    div.innerHTML = `
      <strong>NFC #${item.code}</strong>
      <div>${item.url}</div>
      <div class="nfc-url">
        ${WORKER_URL}/${item.code}
      </div>
    `;


    list.appendChild(div);

  });

}


checkUser();

</script>

</body>
</html>
