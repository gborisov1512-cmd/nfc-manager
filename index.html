<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NFC Manager</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 700px;
      margin: auto;
      padding: 20px;
      background: #f5f5f5;
    }

    h1 {
      text-align: center;
    }

    .box {
      background: white;
      padding: 20px;
      margin-bottom: 20px;
      border-radius: 12px;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      margin: 6px 0 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      padding: 10px 14px;
      border: 0;
      border-radius: 8px;
      background: #111;
      color: white;
      cursor: pointer;
      margin: 4px 2px;
    }

    button:hover {
      opacity: 0.85;
    }

    .danger {
      background: #c62828;
    }

    .secondary {
      background: #666;
    }

    .item {
      background: white;
      border: 1px solid #ddd;
      padding: 15px;
      margin-top: 12px;
      border-radius: 10px;
    }

    .nfc-url {
      word-break: break-all;
      font-size: 14px;
      margin: 8px 0;
    }

    .hidden {
      display: none;
    }

    #message,
    #loginMessage {
      margin-top: 12px;
    }
  </style>
</head>

<body>

<h1>📱 NFC Manager</h1>

<!-- LOGIN -->

<div id="loginBox" class="box">

  <h2>Вход</h2>

  <input
    id="email"
    type="email"
    placeholder="Имейл"
  >

  <input
    id="password"
    type="password"
    placeholder="Парола"
  >

  <button onclick="login()">Вход</button>

  <div id="loginMessage"></div>

</div>


<!-- ADMIN -->

<div id="adminBox" class="hidden">

  <div class="box">

    <h2>Добави NFC</h2>

    <input
      id="code"
      type="text"
      placeholder="NFC код например 004"
    >

    <input
      id="targetUrl"
      type="url"
      placeholder="https://google.com"
    >

    <button onclick="addNfc()">
      Добави NFC
    </button>

    <button
      class="secondary"
      onclick="logout()"
    >
      Изход
    </button>

    <div id="message"></div>

  </div>


  <div class="box">

    <h2>Моите NFC кодове</h2>

    <div id="list">
      Зареждане...
    </div>

  </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
  "https://dnanabhqzdldrtsqpgbi.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_kfnwpu7Kk8wJUm-FRSnWvQ_x_7bcTiw";

const WORKER_URL =
  "https://nfc-redirect.gborisov1512.workers.dev";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


// Проверка за вход

async function checkUser() {

  const {
    data: { session }
  } =
    await supabaseClient.auth.getSession();


  if (session) {

    showAdmin();

  }

}


// Показване на админ панела

function showAdmin() {

  document
    .getElementById("loginBox")
    .classList.add("hidden");

  document
    .getElementById("adminBox")
    .classList.remove("hidden");

  loadNfc();

}


// Вход

async function login() {

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;


  const {
    error
  } =
    await supabaseClient.auth.signInWithPassword({
      email,
      password
    });


  if (error) {

    document
      .getElementById("loginMessage")
      .textContent =
      "Грешка: " + error.message;

    return;

  }


  showAdmin();

}


// Изход

async function logout() {

  await supabaseClient.auth.signOut();

  location.reload();

}


// Добавяне

async function addNfc() {

  const code =
    document.getElementById("code").value.trim();

  const targetUrl =
    document.getElementById("targetUrl").value.trim();


  if (!code || !targetUrl) {

    showMessage(
      "Попълни NFC кода и линка."
    );

    return;

  }


  try {

    new URL(targetUrl);

  } catch {

    showMessage(
      "Линкът не е валиден."
    );

    return;

  }


  const {
    error
  } =
    await supabaseClient
      .from("nfc_links")
      .insert({
        code: code,
        url: targetUrl
      });


  if (error) {

    showMessage(
      "Грешка: " + error.message
    );

    return;

  }


  showMessage(
    "NFC кодът е добавен успешно!"
  );


  document.getElementById("code").value = "";

  document.getElementById("targetUrl").value = "";

  loadNfc();

}


// Зареждане

async function loadNfc() {

  const list =
    document.getElementById("list");


  const {
    data,
    error
  } =
    await supabaseClient
      .from("nfc_links")
      .select("id, code, url")
      .order("id", {
        ascending: false
      });


  if (error) {

    list.textContent =
      "Грешка: " + error.message;

    return;

  }


  if (!data || data.length === 0) {

    list.textContent =
      "Няма NFC кодове.";

    return;

  }


  list.innerHTML = "";


  data.forEach(item => {

    const div =
      document.createElement("div");

    div.className = "item";


    div.innerHTML = `
      <strong>NFC #${escapeHtml(item.code)}</strong>

      <div>
        ${escapeHtml(item.url)}
      </div>

      <div class="nfc-url">
        ${WORKER_URL}/${encodeURIComponent(item.code)}
      </div>

      <button onclick="editNfc(${item.id}, '${escapeJs(item.code)}', '${escapeJs(item.url)}')">
        ✏️ Редактирай
      </button>

      <button onclick="copyNfc('${escapeJs(item.code)}')">
        📋 Копирай NFC адрес
      </button>

      <button
        class="danger"
        onclick="deleteNfc(${item.id}, '${escapeJs(item.code)}')"
      >
        🗑️ Изтрий
      </button>
    `;


    list.appendChild(div);

  });

}


// Редактиране

async function editNfc(id, code, oldUrl) {

  const newUrl =
    prompt(
      "Нов линк за NFC #" + code,
      oldUrl
    );


  if (newUrl === null) {

    return;

  }


  try {

    new URL(newUrl);

  } catch {

    alert("Невалиден линк.");

    return;

  }


  const {
    error
  } =
    await supabaseClient
      .from("nfc_links")
      .update({
        url: newUrl
      })
      .eq("id", id);


  if (error) {

    alert(
      "Грешка: " + error.message
    );

    return;

  }


  alert(
    "Линкът е променен успешно!"
  );


  loadNfc();

}


// Изтриване

async function deleteNfc(id, code) {

  const confirmed =
    confirm(
      "Сигурен ли си, че искаш да изтриеш NFC #" +
      code +
      "?"
    );


  if (!confirmed) {

    return;

  }


  const {
    error
  } =
    await supabaseClient
      .from("nfc_links")
      .delete()
      .eq("id", id);


  if (error) {

    alert(
      "Грешка: " + error.message
    );

    return;

  }


  alert(
    "NFC #" + code + " е изтрит."
  );


  loadNfc();

}


// Копиране

async function copyNfc(code) {

  const address =
    WORKER_URL +
    "/" +
    encodeURIComponent(code);


  try {

    await navigator.clipboard.writeText(address);

    alert(
      "NFC адресът е копиран!"
    );

  } catch {

    prompt(
      "Копирай този адрес:",
      address
    );

  }

}


// Съобщение

function showMessage(text) {

  document
    .getElementById("message")
    .textContent = text;

}


// За безопасно показване

function escapeHtml(value) {

  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


function escapeJs(value) {

  return String(value)
    .replace(/\\/g, "\\\\")
    .replace(/'/g, "\\'");

}


// Стартиране

checkUser();

</script>

</body>
</html>
